appId: com.peleusx.tiny-edit
productName: Tiny Edit
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
mac:
  category: public.app-category.productivity
  icon: build/icon.icns # built by `npm run icon` (scripts/make-icon.mjs), not derived from a PNG
  identity: "-" # ad-hoc signature for personal use; no notarisation
  hardenedRuntime: false
  target:
    - target: dir
      arch: [arm64]
  # Keep in sync with ACCEPTED_EXTENSIONS in src/shared/text.ts. role: Editor only adds Tiny Edit
  # to Finder's "Open With" list; it never steals an existing default handler.
  fileAssociations:
    - ext: [md, markdown, mdx]
      name: Markdown
      role: Editor
    - ext: [txt, text, log, rst, adoc, org]
      name: Plain Text
      role: Editor
    - ext: [json, jsonc, json5, yaml, yml, toml, ini, cfg, conf, env, properties, csv, tsv, xml, plist]
      name: Data or Config File
      role: Editor
    - ext: [html, htm, css, scss, svg]
      name: Web File
      role: Editor
    - ext:
        [
          js,
          mjs,
          cjs,
          jsx,
          ts,
          tsx,
          py,
          sh,
          bash,
          zsh,
          fish,
          sql,
          go,
          rs,
          rb,
          php,
          java,
          kt,
          swift,
          c,
          h,
          cpp,
          hpp,
          cs,
          lua,
          r,
          pl,
          ps1,
          bat,
          diff,
          patch,
          tex,
          bib,
        ]
      name: Source Code File
      role: Editor
# Fuses flipped only in the packaged app; the dev/E2E build keeps Node CLI inspect on for Playwright.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
